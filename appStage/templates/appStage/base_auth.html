{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}BCBStageFlow{% endblock %}</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{% static 'appStage/css/variables.css' %}">
  <link rel="stylesheet" href="{% static 'appStage/css/base.css' %}">
  {% block extra_css %}{% endblock %}

  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <script>
    // Empêche htmx de réutiliser un instantané HTML mis en cache lors d'une
    // navigation (retour arrière, ou parfois même un clic normal) : sans ça,
    // des éléments avec un état modifié par du JS (panneau déplié, onglet
    // actif, etc.) peuvent réapparaître dans leur ancien état au lieu de
    // refléter ce que le serveur renvoie vraiment pour cette page.
    htmx.config.refreshOnHistoryMiss = true;
    htmx.config.historyCacheSize = 0;
  </script>
</head>
<body hx-boost="true" hx-swap="outerHTML swap:120ms settle:120ms" hx-push-url="true">
  {% block content %}{% endblock %}

  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    lucide.createIcons();

    // Ces pages n'ont pas de sidebar fixe à préserver (contrairement au
    // tableau de bord) : htmx boost remplace directement tout le <body> à
    // chaque navigation, d'où le besoin de regénérer les icônes après coup.
    document.body.addEventListener('htmx:afterSettle', function () {
      if (window.lucide) window.lucide.createIcons();
    });

    // Même filet de sécurité que sur le tableau de bord : si htmx échoue
    // (erreur serveur, session, etc.), on retombe sur une navigation classique.
    document.body.addEventListener('htmx:responseError', function (evenement) {
      window.location.href = evenement.detail.xhr.responseURL || window.location.href;
    });
    document.body.addEventListener('htmx:sendError', function () {
      window.location.reload();
    });
  </script>
  {% block extra_js %}{% endblock %}
</body>
</html>
